openapi: 3.1.0
info:
  title: Web3 Backend Engineering Lab
  version: 1.0.0
  description: Deterministic Ethereum reads, authenticated Sepolia writes, and a Notes REST API.
servers:
  - url: http://127.0.0.1:5025
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/ethereum/weth-snapshot:
    get:
      operationId: getWethSnapshot
      responses:
        '200':
          description: Fixed-block WETH9 values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WethSnapshotResponse'
        '502':
          $ref: '#/components/responses/GatewayError'
  /api/v1/contracts/message-registry:
    get:
      operationId: getMessageRegistry
      responses:
        '200':
          description: Current deployment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageRegistryResponse'
        '502':
          $ref: '#/components/responses/GatewayError'
    post:
      operationId: updateMessageRegistry
      security:
        - portfolioWriteToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '200':
          description: Confirmed transaction and resulting state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [hash, status, blockNumber, gasUsed, message, state]
                    properties:
                      hash: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
                      status: { type: string, const: success }
                      blockNumber: { type: string, pattern: '^[0-9]+$' }
                      gasUsed: { type: string, pattern: '^[0-9]+$' }
                      message: { type: string }
                      state: { $ref: '#/components/schemas/MessageRegistryState' }
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '502':
          $ref: '#/components/responses/GatewayError'
        '503':
          $ref: '#/components/responses/RequestError'
  /api/v1/notes:
    get:
      operationId: listNotes
      responses:
        '200':
          description: Ordered notes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Note' }
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteInput' }
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        '400':
          $ref: '#/components/responses/RequestError'
  /api/v1/notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^note-[0-9]{6}$' }
    get:
      operationId: getNote
      responses:
        '200':
          description: Note found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        '404':
          $ref: '#/components/responses/RequestError'
    put:
      operationId: replaceNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteInput' }
      responses:
        '200':
          description: Note replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        '400':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
    delete:
      operationId: deleteNote
      responses:
        '204': { description: Note deleted }
        '404':
          $ref: '#/components/responses/RequestError'
components:
  securitySchemes:
    portfolioWriteToken:
      type: apiKey
      in: header
      name: x-portfolio-write-token
  responses:
    RequestError:
      description: Request cannot be completed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayError:
      description: Upstream blockchain operation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: string }
    MessageInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 280 }
    MessageRegistryState:
      type: object
      required: [network, contract, values]
      properties:
        network:
          type: object
          required: [name, chainId]
          properties:
            name: { type: string, const: Sepolia }
            chainId: { type: integer, const: 11155111 }
        contract:
          type: object
          required: [name, address]
          properties:
            name: { type: string, const: MessageRegistry }
            address: { type: string }
        values:
          type: object
          required: [message, owner]
          properties:
            message: { type: string }
            owner: { type: string }
    MessageRegistryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MessageRegistryState' }
    WethSnapshotResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [network, contract, values]
          properties:
            network: { type: object }
            contract: { type: object }
            values:
              type: object
              required: [name, symbol, decimals, totalSupplyWei]
              properties:
                name: { type: string }
                symbol: { type: string }
                decimals: { type: integer }
                totalSupplyWei: { type: string, pattern: '^[0-9]+$' }
    NoteInput:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string, maxLength: 4000 }
    Note:
      allOf:
        - $ref: '#/components/schemas/NoteInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    NoteResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Note' }
